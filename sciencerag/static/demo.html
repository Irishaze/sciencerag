<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>ScienceRAG · Priors 检索演示</title>
<style>
  :root {
    --bg: #f6f2ea;
    --surface: #ffffff;
    --surface-2: #efe9dd;
    --text: #221f1c;
    --text-dim: #6b6058;
    --line: rgba(34, 31, 28, 0.14);
    --accent: #1f6e78;
    --accent-soft: #d9ecec;
    --warn: #b5541f;
    --warn-soft: #f1ded0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6;
  }
  .page { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  h1 { font-size: 24px; margin: 0 0 6px; }
  .sub { color: var(--text-dim); font-size: 14px; margin: 0 0 32px; }

  .query-box {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }
  textarea {
    flex: 1;
    resize: vertical;
    min-height: 56px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--surface);
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
  }
  button {
    padding: 0 20px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: white;
    font-size: 15px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:disabled { opacity: 0.5; cursor: default; }

  .status {
    display: none;
    align-items: center;
    gap: 10px;
    color: var(--text-dim);
    font-size: 14px;
    margin-bottom: 20px;
  }
  .status.active { display: flex; }
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error {
    display: none;
    background: var(--warn-soft);
    color: var(--warn);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 14px;
    margin-bottom: 20px;
  }
  .error.active { display: block; }

  .summary-bar {
    display: none;
    justify-content: space-between;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 16px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .summary-bar.active { display: flex; }

  .priors { display: flex; flex-direction: column; gap: 12px; }

  .prior-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
  }
  .prior-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
    flex-wrap: wrap;
  }
  .kind-badge {
    font-size: 11px;
    letter-spacing: 0.03em;
    padding: 3px 9px;
    border-radius: 100px;
    background: var(--accent-soft);
    color: var(--accent);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .field-name {
    font-size: 13px;
    color: var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .confidence {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .prior-summary { font-size: 14.5px; margin-bottom: 10px; }
  .prior-source {
    font-size: 12.5px;
    color: var(--text-dim);
    border-top: 1px solid var(--line);
    padding-top: 8px;
  }
  .prior-source a { color: var(--accent); }

  .gaps {
    margin-top: 24px;
    background: var(--warn-soft);
    border-radius: 10px;
    padding: 14px 18px;
    font-size: 13.5px;
    color: var(--warn);
  }
  .gaps h3 { margin: 0 0 8px; font-size: 13px; }
  .gaps ul { margin: 0; padding-left: 18px; }

  .empty-state {
    color: var(--text-dim);
    font-size: 14px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>
<div class="page">
  <h1>ScienceRAG · Priors 检索演示</h1>
  <p class="sub">问一个热电制冷器(TEC)相关的问题,系统会从内部论文库里检索证据,返回带引用的结构化先验知识。首次查询通常需要 15–40 秒。</p>

  <div class="query-box">
    <textarea id="query" placeholder="例如:What design parameters affect the coefficient of performance (COP) of a thermoelectric cooler?"></textarea>
    <button id="submit">查询</button>
  </div>

  <div class="status" id="status"><span class="spinner"></span><span>检索中,请稍候…</span></div>
  <div class="error" id="error"></div>
  <div class="summary-bar" id="summaryBar"></div>

  <div class="priors" id="priors">
    <div class="empty-state">输入问题后点击"查询",结果会显示在这里。</div>
  </div>

  <div class="gaps" id="gaps" style="display:none"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);

function kindLabel(kind) {
  return {
    parameter_range: "参数范围",
    material_property: "材料属性",
    scaling_relationship: "标度关系",
    candidate_config: "候选配置",
    caution: "注意事项",
  }[kind] || kind;
}

function renderPriors(priors) {
  const el = $("priors");
  if (priors.length === 0) {
    el.innerHTML = '<div class="empty-state">没有找到置信度足够高的先验知识(可能全部落进了下方 gaps)。</div>';
    return;
  }
  el.innerHTML = priors.map((p) => {
    const src = p.sources[0] || {};
    const doiLink = src.doi
      ? `<a href="https://doi.org/${src.doi}" target="_blank" rel="noopener">${src.doi}</a>`
      : "(no DOI)";
    return `
      <div class="prior-card">
        <div class="prior-head">
          <span class="kind-badge">${kindLabel(p.kind)}</span>
          <span class="field-name">${p.field}</span>
          <span class="confidence">confidence ${p.confidence.toFixed(2)}</span>
        </div>
        <div class="prior-summary">${(p.value && p.value.summary) || ""}</div>
        <div class="prior-source">${p.notes || ""} — ${doiLink} · ${src.span || ""}</div>
      </div>
    `;
  }).join("");
}

function renderGaps(gaps) {
  const el = $("gaps");
  if (!gaps || gaps.length === 0) {
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  el.innerHTML = `<h3>覆盖不足提示</h3><ul>${gaps.map((g) => `<li>${g}</li>`).join("")}</ul>`;
}

async function runQuery() {
  const query = $("query").value.trim();
  if (!query) return;

  $("submit").disabled = true;
  $("status").classList.add("active");
  $("error").classList.remove("active");
  $("summaryBar").classList.remove("active");
  $("priors").innerHTML = "";
  $("gaps").style.display = "none";

  try {
    const resp = await fetch("/sciencerag/priors", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ query }),
    });
    const body = await resp.json();
    if (!resp.ok) {
      throw new Error(body.detail ? JSON.stringify(body.detail) : `HTTP ${resp.status}`);
    }

    $("summaryBar").classList.add("active");
    $("summaryBar").innerHTML = `
      <span>trace_id: ${body.trace_id}</span>
      <span>internal_hits: ${body.coverage.internal_hits} · priors: ${body.priors.length}</span>
    `;
    renderPriors(body.priors);
    renderGaps(body.coverage.gaps);
  } catch (err) {
    $("error").classList.add("active");
    $("error").textContent = "查询失败: " + err.message;
  } finally {
    $("status").classList.remove("active");
    $("submit").disabled = false;
  }
}

$("submit").addEventListener("click", runQuery);
$("query").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) runQuery();
});
</script>
</body>
</html>
