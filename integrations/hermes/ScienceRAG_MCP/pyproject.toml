[project]
name = "sciencerag-mcp"
version = "0.1.0"
description = "MCP adapter for ScienceRAG (ask/priors/validate/report/kg_approval)"
requires-python = ">=3.10"
# Pinned to match the mcp version already installed in
# COMSOL_Multiphysics_MCP/.venv (the shared venv all three MCP adapters run
# under on the Windows box, per run-*-mcp-for-hermes.ps1) — a bare ">=1.0.0"
# floor picks up whatever's newest at install time, and a newer mcp release
# has already renamed/reshaped the mcp.server.fastmcp API this adapter uses.
dependencies = [
    "mcp==1.28.1",
    "pydantic>=2.0.0",
]

[project.scripts]
sciencerag-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
