[project]
name = "sciencerag"
version = "0.1.0"
description = "ScienceRAG: prior-retrieval, validation, reporting, and graph Q&A endpoints for the TEC simulation loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic>=2",
    "jsonschema",
    "paper-qa==5.29.1",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sciencerag"]
